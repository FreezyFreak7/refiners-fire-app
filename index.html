<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Refiner's Fire — A dramatic Bible challenge</title>
    <meta
      name="description"
      content="Memorise scripture, play live with friends, and build your own quizzes. A dramatic Bible challenge, forged in Revelation."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#08070a" />

    <!--
      Open Graph / Twitter cards. og:image and og:url must be ABSOLUTE urls — crawlers do not
      resolve relative paths, and a relative image is the usual reason a shared link renders
      with no picture. Update SITE_URL below if the domain changes.
    -->
    <meta property="og:site_name" content="Refiner's Fire" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Refiner's Fire — A dramatic Bible challenge" />
    <meta
      property="og:description"
      content="Memorise scripture, play live with friends, and build your own quizzes. Forged in Revelation."
    />
    <meta property="og:url" content="https://playrefinersfire.com/" />
    <meta property="og:image" content="https://playrefinersfire.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Refiner's Fire — a dramatic Bible challenge, forged in Revelation." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Refiner's Fire — A dramatic Bible challenge" />
    <meta
      name="twitter:description"
      content="Memorise scripture, play live with friends, and build your own quizzes. Forged in Revelation."
    />
    <meta name="twitter:image" content="https://playrefinersfire.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
